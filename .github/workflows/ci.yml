name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Show Xcode and Swift versions
        run: |
          XCODE_PATH=$(xcode-select -p)
          echo "Using Xcode at: $XCODE_PATH"
          xcodebuild -version
          echo ""
          swift --version
        run: swift --version
      
      - name: Build SnifLeaf-macOS
        run: |
          xcodebuild clean build \
            -project SnifLeaf.xcodeproj \
            -scheme SnifLeaf-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project SnifLeaf.xcodeproj \
            -scheme SnifLeaf-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 30
      
      - name: Generate Code Coverage Report
        if: always()
        run: |
          xcrun xccov view --report --only-targets TestResults.xcresult > coverage.txt || true
      
      - name: Upload Coverage to Codecov
        if: always() && secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          xcode: true
          xcode_archive_path: TestResults.xcresult
